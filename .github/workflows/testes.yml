# Roda os testes do backend e da interface, e o build, a cada push e pull request.
# Sem isto, um teste quebrado só aparecia quando alguém rodava a suíte no PC.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      # requirements-local.txt traz o Playwright (biblioteca), que alguns módulos importam; os navegadores
      # não são baixados porque nenhum teste abre o Chrome.
      - name: Dependências do backend
        run: pip install -r requirements-local.txt
      - name: Testes do backend
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee testes-backend.log
      # Os testes que falharam aparecem como anotação na página da execução, sem precisar abrir o log.
      - name: Resumo das falhas do backend
        if: failure()
        run: |
          python - <<'EOF'
          import re
          log = open('testes-backend.log', encoding='utf-8', errors='replace').read()
          blocos = re.split(r'^={50,}$', log, flags=re.M)[1:]
          linhas = []
          for b in blocos:
              b = b.strip()
              titulo = b.splitlines()[0] if b else ''
              erro = [l for l in b.splitlines() if re.match(r'^\w*(Error|Exception)\b', l)]
              linhas.append(titulo + ' :: ' + (erro[-1] if erro else '')[:300])
          print('::error title=Testes do backend que falharam::' + '%0A'.join(linhas[:15]))
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências da interface
        working-directory: frontend
        run: npm ci
      - name: Testes da interface
        working-directory: frontend
        run: npm test
      - name: Build da interface
        working-directory: frontend
        run: npm run build
